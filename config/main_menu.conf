[menu __main]
name: {{ gettext('Main Menu') }}

[menu __main move]
name: {{ gettext('Move') }}
icon: move
panel: revo_move
enable: {{ revo.ekran }}

[menu __main move_ks]
name: {{ gettext('Move') }}
icon: move
panel: move
enable: {{ not revo.ekran }}

[menu __main temperature]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: revo_temp
enable: {{ revo.ekran and ((printer.temperature_devices.count > 0) or (printer.extruders.count > 0)) }}

[menu __main temperature_ks]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: temperature
enable: {{ not revo.ekran and ((printer.temperature_devices.count > 0) or (printer.extruders.count > 0)) }}

[menu __main extrude]
name: Filament
icon: extrude
panel: revo_filament
enable: {{ revo.ekran and (printer.extruders.count > 0) }}

[menu __main extrude_ks]
name: Filament
icon: extrude
panel: extrude
enable: {{ not revo.ekran and (printer.extruders.count > 0) }}

[menu __main more]
name: {{ gettext('More') }}
icon: settings

[menu __main print]
name: {{ gettext('Print') }}
icon: printer
panel: revo_files
enable: {{ revo.ekran and (printer.extruders.count > 0) }}

[menu __main print_ks]
name: {{ gettext('Print') }}
icon: printer
panel: gcodes
enable: {{ not revo.ekran and (printer.extruders.count > 0) }}

[menu __main gcodes]
name: {{ gettext('Gcodes') }}
icon: files
panel: revo_files
enable: {{ revo.ekran and (printer.extruders.count == 0) }}

[menu __main gcodes_ks]
name: {{ gettext('Gcodes') }}
icon: files
panel: gcodes
enable: {{ not revo.ekran and (printer.extruders.count == 0) }}

